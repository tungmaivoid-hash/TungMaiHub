<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel & Image to Chat - Tung Mai</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>
    <header class="site-header">
        <div class="nav-container">
            <a href="index.html" class="logo">Tung Mai Hub</a>
            <nav>
                <ul class="nav-menu">
                    <li><a href="index.html">Home</a></li>
                    <li class="dropdown">
                        <a href="#">Tính năng ▼</a>
                        <div class="dropdown-content">
                            <a href="pdf.html">PDF to IMG</a>
                            <a href="excel.html">Excel & Image to Chat</a>
                        </div>
                    </li>
                </ul>
            </nav>
        </div>
    </header>

    <div class="container">
        <section class="main-content">
            <h1>Excel & Image to Chat</h1>
            <p class="subtitle">Dán dữ liệu Excel hoặc paste ảnh để tạo phiếu giá và chia sẻ</p>

            <div class="input-section">
                <div class="input-box">
                    <textarea id="input" placeholder="Dán dữ liệu Excel (tab-separated) hoặc paste ảnh vào đây..." rows="3"></textarea>
                    <button id="send-btn" class="send-btn" title="Gửi (Enter)">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                    </button>
                </div>

                <div class="action-buttons">
                    <button id="sample-btn" class="action-btn" title="Dữ liệu mẫu">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="9" y1="9" x2="15" y2="15"></line><line x1="15" y1="9" x2="9" y2="15"></line></svg>
                        Mẫu
                    </button>
                    <button id="test-btn" class="action-btn" title="Test dữ liệu">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14,2 14,8 20,8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10,9 9,9 8,9"></polyline></svg>
                        Test
                    </button>
                    <button id="download-all-btn" class="action-btn primary" title="Tải tất cả ảnh">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                        Tải ZIP
                    </button>
                    <button id="clear-btn" class="action-btn danger" title="Xóa tất cả">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
                        Xóa
                    </button>
                </div>
            </div>

            <div id="status" class="status-text"></div>
            <div id="preview" class="image-preview"></div>
        </section>
    </div>

    <!-- Hidden export area for image generation -->
    <div id="export-area" style="position: absolute; left: -9999px; top: -9999px;"></div>

    <script>
        // DOM Elements
        const input = document.getElementById("input");
        const preview = document.getElementById("preview");
        const status = document.getElementById("status");
        const sendBtn = document.getElementById("send-btn");
        const downloadAllBtn = document.getElementById("download-all-btn");
        const clearBtn = document.getElementById("clear-btn");
        const testBtn = document.getElementById("test-btn");
        const sampleBtn = document.getElementById("sample-btn");

        // State
        let imageBlobs = []; // For pasted images
        let chatImageBlobs = []; // Store all blobs for download all
        let imageCounter = 1;
        const fileNamePrefix = "TungMai";

        function sanitizeFilename(name) {
            return `${fileNamePrefix}_${name}`
                .replace(/[\\/:*?"<>| ]+/g, '_')
                .replace(/_+/g, '_')
                .replace(/^_+|_+$/g, '');
        }

        function getImageFileBase() {
            const fileBase = `${fileNamePrefix}_IMG_${String(imageCounter).padStart(2, '0')}`;
            imageCounter += 1;
            return fileBase;
        }

        function imageLabelFromFileBase(fileBase) {
            return fileBase
                .replace(/^TungMai_/, '')
                .replace(/_/g, ' ')
                .replace(/IMG\s0+(\d+)/, 'IMG $1');
        }

        function generateZipFilename() {
            const now = new Date();
            const timestamp = `${now.getFullYear()}${String(now.getMonth() + 1).padStart(2, '0')}${String(now.getDate()).padStart(2, '0')}_${String(now.getHours()).padStart(2, '0')}${String(now.getMinutes()).padStart(2, '0')}${String(now.getSeconds()).padStart(2, '0')}`;
            const randomId = Math.random().toString(36).slice(2, 6).toUpperCase();
            return `${fileNamePrefix}_${timestamp}_${randomId}.zip`;
        }

        // Functions
        async function processInput() {
            const text = input.value.trim();
            if (text === "" && imageBlobs.length === 0) return;

            status.textContent = "Đang xử lý...";

            try {
                if (text !== "" && isExcelData(text)) {
                    // Process Excel data
                    status.textContent = "Đang tạo phiếu giá...";
                    const canvas = await createImageFromData(text);
                    const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.95));
                    addImageToPreview(blob, `Phiếu giá ${chatImageBlobs.length + 1}`);
                    status.textContent = "Đã thêm phiếu giá!";
                } else if (imageBlobs.length > 0) {
                    // Process pasted images
                    status.textContent = `Đang xử lý ${imageBlobs.length} ảnh...`;
                    for (let i = 0; i < imageBlobs.length; i++) {
                        addImageToPreview(imageBlobs[i], `Ảnh ${chatImageBlobs.length + 1}`);
                    }
                    status.textContent = `Đã thêm ${imageBlobs.length} ảnh!`;
                } else {
                    status.textContent = "Vui lòng dán dữ liệu Excel hoặc ảnh!";
                    return;
                }
            } catch (error) {
                console.error('Error processing input:', error);
                status.textContent = "Có lỗi xảy ra!";
                return;
            }

            // Clear input
            input.value = "";
            imageBlobs = [];

            // Clear status after 3 seconds
            setTimeout(() => {
                status.textContent = "";
            }, 3000);
        }

        function addImageToPreview(blob, title) {
            const url = URL.createObjectURL(blob);
            const fileBase = getImageFileBase();
            chatImageBlobs.push({ blob, title, fileBase, url });

            const imageItem = document.createElement('div');
            imageItem.className = 'image-item';

            imageItem.innerHTML = `
                <img src="${url}" alt="${title}" onclick="openModal(['${url}'], 0)">
                <div class="image-actions">
                    <button class="download-btn" data-file-base="${fileBase}" onclick="downloadImage('${url}', this, '${title.replace(/'/g, "\\'")}')">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="7 10 12 15 17 10"></polyline>
                            <line x1="12" y1="15" x2="12" y2="3"></line>
                        </svg>
                        ${imageLabelFromFileBase(fileBase)}
                    </button>
                    <button class="remove-btn" data-file-base="${fileBase}" onclick="removeImage(this)">
                        Xóa
                    </button>
                </div>
            `;

            preview.appendChild(imageItem);
            preview.scrollIntoView({ behavior: 'smooth', block: 'end' });
        }

        function downloadImage(url, button, title) {
            const a = document.createElement("a");
            a.href = url;
            const fileBase = button?.dataset?.fileBase || sanitizeFilename(title);
            a.download = `${fileBase}.jpg`;
            a.click();
        }

        function removeImage(button) {
            const fileBase = button?.dataset?.fileBase;
            if (!fileBase) return;

            const index = chatImageBlobs.findIndex(item => item.fileBase === fileBase);
            if (index === -1) return;

            const item = chatImageBlobs[index];
            if (item.url && item.url.startsWith('blob:')) {
                URL.revokeObjectURL(item.url);
            }
            chatImageBlobs.splice(index, 1);

            const imageItem = button.closest('.image-item');
            if (imageItem) {
                imageItem.remove();
            }
        }

        function isExcelData(text) {
            const rows = text.split('\n');
            console.log('Rows:', rows.length, 'Headers:', rows[0]?.split('\t').length);
            return rows.length >= 2 && rows[0].split('\t').length > 1;
        }

        async function createImageFromData(data) {
            const rows = data.split('\n');
            const headers = rows[0].split('\t');
            const tableData = rows.slice(1);

            const area = document.getElementById('export-area');
            area.innerHTML = `
                <div class="chat-container" id="temp-s">
                    <div class="chat-bubble">
                        <div class="chat-header">THÔNG TIN TÍNH GIÁ CĂN HỘ</div>
                        <table class="data-table">
                            <thead><tr>${headers.map(h => `<th>${h}</th>`).join('')}</tr></thead>
                            <tbody>${tableData.map(row => `<tr>${row.split('\t').map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody>
                        </table>
                    </div>
                </div>`;
            const el = document.getElementById('temp-s');
            const canvas = await html2canvas(el, {
                scale: 2,
                backgroundColor: null
            });
            return canvas;
        }

        function openModal(images, index) {
            // Simple modal implementation - you can expand this
            const modal = document.createElement('div');
            modal.style.cssText = `
                position: fixed; top: 0; left: 0; width: 100%; height: 100%;
                background: rgba(0,0,0,0.8); display: flex; align-items: center;
                justify-content: center; z-index: 1000; cursor: pointer;
            `;

            const img = document.createElement('img');
            img.src = images[index];
            img.style.cssText = 'max-width: 90%; max-height: 90%; object-fit: contain;';

            modal.appendChild(img);
            modal.onclick = () => modal.remove();
            document.body.appendChild(modal);
        }

        function downloadAllImages() {
            if (chatImageBlobs.length === 0) {
                status.textContent = "Không có ảnh nào để tải!";
                setTimeout(() => status.textContent = "", 3000);
                return;
            }

            status.textContent = "Đang tạo file ZIP...";

            const zip = new JSZip();
            const folder = zip.folder("excel_images");

            chatImageBlobs.forEach((item) => {
                folder.file(`${item.fileBase}.jpg`, item.blob);
            });

            zip.generateAsync({ type: "blob" })
                .then((content) => {
                    const a = document.createElement("a");
                    a.href = URL.createObjectURL(content);
                    a.download = generateZipFilename();
                    a.click();
                    URL.revokeObjectURL(a.href);
                    status.textContent = "Đã tải xuống ZIP!";
                    setTimeout(() => status.textContent = "", 3000);
                })
                .catch(err => {
                    console.error("Lỗi khi nén:", err);
                    status.textContent = "Lỗi khi tạo ZIP!";
                    setTimeout(() => status.textContent = "", 3000);
                });
        }

        function clearAll() {
            // Revoke all blob URLs
            preview.querySelectorAll('img').forEach(img => {
                if (img.src.startsWith('blob:')) {
                    URL.revokeObjectURL(img.src);
                }
            });

            preview.innerHTML = "";
            chatImageBlobs = [];
            input.value = "";
            status.textContent = "Đã xóa tất cả!";
            setTimeout(() => status.textContent = "", 2000);
        }

        // Event Listeners
        sendBtn.addEventListener("click", processInput);
        sampleBtn.addEventListener("click", () => {
            input.value = `Tên\tGiá\tDiện tích\tPhòng\nCăn hộ A\t2 tỷ\t80m2\t3PN\nCăn hộ B\t3 tỷ\t100m2\t4PN`;
        });
        testBtn.addEventListener("click", () => {
            const text = input.value.trim();
            console.log('Test data:', text);
            console.log('Is Excel data:', isExcelData(text));
            const rows = text.split('\n');
            alert(`Dữ liệu có ${rows.length} dòng${rows.length > 0 ? `, header có ${rows[0].split('\t').length} cột` : ''}`);
        });
        input.addEventListener("keypress", (e) => {
            if (e.key === "Enter" && !e.shiftKey) {
                e.preventDefault();
                processInput();
            }
        });

        // Paste handling
        input.addEventListener("paste", (e) => {
            const items = e.clipboardData?.items;
            if (items) {
                // Check for images first
                for (let i = 0; i < items.length; i++) {
                    if (items[i].type.indexOf('image') !== -1) {
                        e.preventDefault();
                        const blob = items[i].getAsFile();
                        imageBlobs.push(blob);
                        status.textContent = "Đã dán ảnh! Bấm Enter hoặc Send để thêm.";
                        setTimeout(() => status.textContent = "", 3000);
                        return;
                    }
                }

                // If no images, check for text
                setTimeout(() => {
                    const text = input.value.trim();
                    if (isExcelData(text)) {
                        status.textContent = "Đã dán dữ liệu Excel! Bấm Enter hoặc Send để tạo phiếu giá.";
                        setTimeout(() => status.textContent = "", 3000);
                    }
                }, 100);
            }
        });

        document.addEventListener("paste", (e) => {
            if (e.target === input) return;
            const items = e.clipboardData?.items;
            if (items) {
                for (let i = 0; i < items.length; i++) {
                    if (items[i].type.indexOf('image') !== -1) {
                        e.preventDefault();
                        const blob = items[i].getAsFile();
                        imageBlobs.push(blob);
                        input.focus();
                        status.textContent = "Đã dán ảnh từ nơi khác! Bấm Enter hoặc Send để thêm.";
                        setTimeout(() => status.textContent = "", 3000);
                        return;
                    }
                }
            }

            const text = e.clipboardData?.getData('text/plain')?.trim();
            if (text && isExcelData(text)) {
                e.preventDefault();
                input.value = text;
                input.focus();
                status.textContent = "Đã dán dữ liệu Excel từ nơi khác! Bấm Enter hoặc Send để tạo phiếu giá.";
                setTimeout(() => status.textContent = "", 3000);
            }
        });

        downloadAllBtn.addEventListener("click", downloadAllImages);
        clearBtn.addEventListener("click", clearAll);
    </script>
</body>
</html>
